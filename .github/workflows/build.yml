name: consolidated build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib olean cache
        run: lake exe cache get

      - name: Place modules where the lakefile globs expect them
        run: mkdir -p RequestProject && cp lean/*.lean RequestProject/

      - name: Build all modules
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Sorry census — only the three disclosed sites are allowed
        shell: bash
        run: |
          if grep "declaration uses" build.log \
              | grep -vE 'RequestProject/(D4|F3|F3R)\.lean'; then
            echo "::error::sorry warning outside the disclosed sites (D4, F3, F3R)"
            exit 1
          fi
          count=$(grep -c "declaration uses" build.log || true)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected exactly 3 disclosed sorry warnings, found $count"
            exit 1
          fi
          echo "sorry census OK: exactly the 3 disclosed sites"
