name: consolidated build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib olean cache
        run: lake exe cache get

      - name: Build all modules
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Sorry census — no sorry anywhere in the development
        shell: bash
        run: |
          if grep "declaration uses" build.log; then
            echo "::error::sorry warning found; the development is sorry-free as of 2026-09-14"
            exit 1
          fi
          echo "sorry census OK: no sorry anywhere in the development"

  # Comparator verification (leanprover/comparator): checks that the repo
  # proves exactly the statements in Challenge.lean, for the 16 headline
  # theorems whose axioms are propext/Quot.sound/Classical.choice only.
  # Pins follow leanprover/lean-eval's SECURITY.md (NanoDa pin from
  # PalomarRegistry/PalomarTemplate); lean4export uses the
  # v4.28.0 tag to match this repo's toolchain.
  comparator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install landrun (pinned)
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build lean4export (v4.28.0 tag, matches repo toolchain)
        run: |
          git clone https://github.com/leanprover/lean4export .ci/lean4export
          cd .ci/lean4export
          git checkout d065b0009aed0520e9e99752847a33b337661690
          lake build lean4export
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build comparator (pinned)
        run: |
          git clone https://github.com/leanprover/comparator .ci/comparator
          cd .ci/comparator
          git checkout 71b52ec29e06d4b7d882726553b1ceb99a2499e0
          lake build comparator
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build NanoDa kernel (pinned; comparator.json enables the NanoDa replay)
        run: |
          git clone https://github.com/robsimmons/nanoda_lib .ci/nanoda_lib
          cd .ci/nanoda_lib
          git checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Get Mathlib olean cache
        run: lake exe cache get

      - name: Run comparator (Palomar submission surface, classical axioms only, Lean + NanoDa replay)
        run: lake env comparator comparator.json
