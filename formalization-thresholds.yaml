# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Second Palomar entry from this repository (certified
# horizon thresholds). Comparator configuration: comparator-thresholds.json.
version: "v0.4"

project:
  name: "Certified Positivity: certified horizon thresholds for truncated Weil-type Toeplitz forms at the true prime atoms"
  description: >-
    Weil's explicit formula recasts the Riemann Hypothesis as positivity of a
    quadratic form assembled from prime powers, and a recent computational
    programme (Connes and van Suijlekom; Connes, Consani and Moscovici)
    studies truncations of that form numerically, in floating point. This
    Lean 4 and Mathlib development gives exact, machine-checked data about one
    explicit discretization family of such truncations. The atom of a prime p
    is a_p = (log p)/sqrt p, the leading weight the Weil form attaches to the
    sites plus and minus log p. For window size m + 1 the family is the
    symmetric Toeplitz matrix with diagonal kappa and, at distance k, the
    atom of the k-th prime; restricting to a longer window lets one more prime
    enter. The horizon threshold kappa* of a window is the infimum of the kappa
    at which this matrix is positive definite (it is positive definite exactly
    for kappa > kappa*, since raising kappa adds a multiple of the identity):
    the archimedean mass needed to absorb the primes inside the window.

    The seven compared results bracket the thresholds of windows 2, 3 and 4 and
    record how they are produced. (1, 2) The 3 by 3 matrix with atoms a_2, a_3
    is positive definite at kappa = 0.635 and not positive definite at
    kappa = 0.6. (3, 4) The 4 by 4 matrix with atoms a_2, a_3, a_5 is positive
    definite at kappa = 0.790 and not positive definite at kappa = 0.789.
    (5, 6) The 5 by 5 matrix with atoms a_2, a_3, a_5, a_7 is positive definite
    at kappa = 0.921 and not positive definite at kappa = 0.919. So the
    thresholds lie in [0.6, 0.635), [0.789, 0.790) and [0.919, 0.921).
    (7) Joint binding: (log p)/sqrt p < 0.919 for every prime p. The window-4
    threshold therefore exceeds the atom of every single prime, so it is
    produced by the atoms jointly and not by any one of them; the proof rests
    on the atom being strictly decreasing beyond 8, with its maximum over the
    primes at p = 7.

    The interest is twofold. First, the bracketed chain of thresholds is, to
    our knowledge, the first formally verified quantitative data about
    truncations of a Weil-type form, where the literature has floating-point
    smallest-eigenvalue curves. Second, the data decide a question about how
    positivity is lost as primes enter: at window 2 the threshold interval
    contains the newest atom a_3, suggesting that the newest prime always
    binds; the window-3 bracket lies strictly above a_5 (about 0.7197), which
    refutes that, and theorem (7) shows that from window 4 no single prime
    can account for the threshold at all.

    Scope is finite and explicit. These are statements about the stated
    schematic discretization family (distance-indexed atoms on a Toeplitz
    window), not about the genuine Weil kernel; whether joint binding persists
    for the genuine kernel is open. Nothing here bears on the Riemann
    Hypothesis.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11M26", "15B48", "68V20", "65G20", "15A63", "11M06"]

sources:
  - title: >-
      Certified horizon thresholds for windows 2 to 4 of a truncated Weil-type
      Toeplitz family at the true prime atoms, and the joint-binding theorem
    authors:
      - "Rohan Badade"
    type: original-proof
    relationship: other
    author_endorsement: participated
    note: >-
      These results are first presented by this formalization and the
      accompanying preprint Certified Positivity, which is written from it. No
      earlier source states them. Recorded as type original-proof with
      relationship other, as the Palomar original-result contract requires;
      every other source below is contextual background.
  - title: >-
      Certified Positivity: Formally Verified Horizon Thresholds for Truncated
      Weil Quadratic Forms in Lean
    authors:
      - "Rohan Badade"
    type: paper
    location: "papers/certified-positivity-paper.pdf in this repository, Section 4 and Table 2"
    relationship: background
    license: "unknown"
    author_endorsement: participated
    note: >-
      Unsubmitted preprint by the submitter, carried in this repository. It has
      no arXiv identifier and no DOI, and the copy here is one or more
      revisions behind the canonical off-repo version (see
      papers/PENDING-SYNC.md). It is the informal write-up of this development
      rather than a prior source for it, hence background. Section 4 and
      Table 2 present the seven compared results.
  - title: "Quadratic forms, real zeros and echoes of the spectral action"
    authors:
      - "Alain Connes"
      - "Walter D. van Suijlekom"
    id: "arXiv:2511.23257"
    type: paper
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The floating-point study of truncated Weil quadratic forms whose
      smallest-eigenvalue behaviour the certified thresholds are compared
      with. No statement of theirs is formalized here, and none of the
      compared theorems is theirs.
  - title: "Zeta spectral triples"
    authors:
      - "Alain Connes"
      - "Caterina Consani"
      - "Henri Moscovici"
    id: "arXiv:2511.22755"
    type: paper
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The operator-theoretic reading of truncated Weil forms that motivates the
      wider development. Context only: none of its results is formalized, and
      none of the compared theorems is one of theirs.
  - title: 'Sur les "formules explicites" de la theorie des nombres premiers'
    authors:
      - "Andre Weil"
    type: paper
    location: "Comm. Sem. Math. Univ. Lund (1952), 252-265"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: >-
      The explicit formula and the positivity criterion that give the
      programme its subject, and the source of the atom weights
      (log p)/sqrt p. The compared statements concern a finite discretization
      family built from those weights; the source's own results are not
      formalized here.
  - title: "mathlib4: the Lean mathematical library"
    authors:
      - "The Mathlib Community"
    id: "https://github.com/leanprover-community/mathlib4"
    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"
    note: >-
      The ambient library. ChallengeThresholds.lean imports only Mathlib.
      Mathlib supplies the matrix, analytic and logarithm infrastructure used
      (determinants, Real.log and Real.sqrt, the Mercator-series bound
      Real.abs_log_sub_add_sum_range_le and the digit bounds on log 2 behind
      the atom enclosures). It is a Lean dependency, not a mathematical source
      for any compared statement.

