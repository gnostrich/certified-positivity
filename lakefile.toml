name = "RequestProject"
defaultTargets = ["RequestProject"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "ChallengeThresholds"

[[lean_lib]]
name = "SolutionThresholds"

# Slice ported from Levent Alpöge's Lean RH development (mirror CocoSgt @7cbf7a0),
# used with the author's permission; options match the upstream project.
[[lean_lib]]
name = "AlpogeRH"
globs = ["AlpogeRH.+"]
moreLeanArgs = ["--tstack=400000"]
leanOptions = { maxHeartbeats = 4000000, autoImplicit = false, relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }
