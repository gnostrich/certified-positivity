      module: "Challenge"
      status: proved
      note: >-
        The explicit Rayleigh floor of the paper's true-kernel window: 0.005
        times the squared norm bounds the quadratic form of the genuine screw
        Gram matrix on the grid (0.2, 0.4, 0.6); proved sorry-free as
        V5_5.true_kernel_grid_margin in RequestProject/V5_5.lean.
    - source: "Certified Positivity, headline theorem V5_5 (true-kernel window)"
      lean: "Challenge.true_kernel_grid_posdef"
      module: "Challenge"
      status: proved
      note: >-
        The positive-definiteness half of the same window, the paper's claimed
        first explicit machine-checked instance of Suzuki's existential
        Theorem 4.2; proved sorry-free as V5_5.true_kernel_grid_posdef in
        RequestProject/V5_5.lean.
    - source: "Certified Positivity, headline theorem V5_6 (persistence across the first prime)"
      lean: "Challenge.true_kernel_first_prime_posdef"
      module: "Challenge"
      status: proved
      note: >-
        The two-site true-kernel Gram matrix on (0.4, 0.9) is positive
        definite. The prime sum in Psi vanishes for t below log 2 (about
        0.693) and the node 0.9 lies above it, so the p = 2 prime term
        contributes to this matrix; proved sorry-free as
        V5_6.true_kernel_first_prime_posdef in RequestProject/V5_6.lean.
    - source: "Certified Positivity, headline theorem V5_7 (prime-side identity)"
      lean: "Challenge.weil_triangle_prime_side"
      module: "Challenge"
      status: proved
      note: >-
        The exact identity welding the paper's two formal objects: the von
        Mangoldt weighted triangle-kernel sum over prime powers up to N equals
        the prime sum of the screw function, for t > 0 and exp t at most N;
        proved
        sorry-free as V5_7.weil_triangle_prime_side in
        RequestProject/V5_7.lean.
    - source: "Certified Positivity, G3 (third-window non-positivity certificate)"
      lean: "Challenge.G3_cert_neg"
      module: "Challenge"
      status: proved
      note: >-
        The 4 by 4 symmetric Toeplitz matrix U with diagonal 0.789 and
        off-diagonal entries (log 2)/sqrt 2, (log 3)/sqrt 3 and
        (log 5)/sqrt 5, the true prime atoms, is not positive definite. This
        is the non-positivity half of the preprint's third-window threshold
        computation; only non-positivity at 0.789 is compared. Proved
        sorry-free as G3.G3_cert_neg in RequestProject/G3.lean. Its
        numeric-bound dependencies in RequestProject/E2.lean and
        RequestProject/G4.lean were re-proved native_decide-free on
        2026-09-14 (see status.scope).
    - source: "Certified Positivity, G5 (global maximum of log p/√p at p = 7, prime form)"
      lean: "Challenge.G5_c_prime"
      module: "Challenge"
      status: proved
      note: >-
        For every prime p other than 7, (log p)/sqrt p is strictly less than
        (log 7)/sqrt 7: the atom at p = 7 is the global maximum over all
        primes; proved sorry-free as G5.G5_c_prime in RequestProject/G5.lean.
        Depends on RequestProject/G4.lean's log 11 enclosure, re-proved
        native_decide-free on 2026-09-14 (see status.scope).

