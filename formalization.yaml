      comparator_config: "comparator.json"
    - declaration: "V5_6.true_kernel_first_prime_posdef"
      file: "RequestProject/V5_6.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
