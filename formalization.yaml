# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Palomar registry submission for this repository.
version: "v0.4"

project:
  name: "Certified Positivity: machine-checked positivity windows for the Suzuki zeta screw kernel"
  description: >-
    This Lean 4 and Mathlib development produces exact, machine-checked
    positivity certificates for finite Gram matrices built from Suzuki's zeta
    screw function.
    Weil's explicit formula recasts the Riemann Hypothesis as positivity of a
    quadratic form assembled from prime powers, and a recent line of work
    truncates that form and studies the resulting finite matrices. The objects
    formalized here are the screw function Psi, defined as an archimedean
    profile minus a von Mangoldt weighted prime sum and extended evenly; its
    Gram kernel G(t,u) = Psi(t) + Psi(u) - Psi(t-u); and positive
    definiteness, in the quadratic-form sense, of the finite matrices this
    kernel generates on explicit grids.

    The three compared results are as follows. (1) On the grid (0.2, 0.4, 0.6)
    the 3 by 3 Gram matrix M3 of the genuine kernel satisfies an explicit
    Rayleigh floor: for every real vector x, 0.005 times the sum of the x_i
    squared is at most the quadratic form of M3 at x. (2) M3 is positive
    definite. (3) On the grid (0.4, 0.9) the 2 by 2 Gram matrix is positive
    definite. The prime sum in Psi vanishes for t below log 2 (about 0.693)
    and the node 0.9 lies above it, so the p = 2 prime term contributes to
    this matrix.

    The interest is that the surrounding literature (Connes and van Suijlekom;
    Connes, Consani and Moscovici; Suzuki) works either in floating point or at
    the level of existence statements, whereas these are exact certificates
    checked against the definition of Psi itself. Suzuki establishes that some
    positivity window exists; here an explicit one is exhibited, with an
    explicit margin, and verified, to our knowledge for the first time.

    Scope is finite and explicit. Every positivity statement concerns a
    specified grid at specified rational nodes; there is no asymptotic,
    fine-mesh or all-grid result; and nothing here bears on the Riemann
    Hypothesis.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11M26", "15B48", "68V20", "65G20", "15A63", "11M06"]

sources:
  - title: >-
      Explicit machine-checked positivity windows for the genuine Suzuki zeta
      screw kernel
    authors:
      - "Rohan Badade"
    type: original-proof
    relationship: other
    author_endorsement: participated
    note: >-
      These results are first presented by this formalization and the
      accompanying preprint Certified Positivity, which is written from it. No
      earlier source states them. Recorded as type original-proof with relationship other, as
      the Palomar original-result contract requires; every other source below
      is contextual background.
  - title: >-
      Certified Positivity: Formally Verified Horizon Thresholds for Truncated
      Weil Quadratic Forms in Lean
    authors:
      - "Rohan Badade"
    type: paper
    location: "papers/certified-positivity-paper.pdf in this repository"
    relationship: background
    license: "unknown"
    author_endorsement: participated
    note: >-
      Unsubmitted preprint by the submitter, carried in this repository. It has
      no arXiv identifier and no DOI; it is not archived anywhere outside this
      repository, and the copy here is one or more revisions behind the
      canonical off-repo version (see papers/PENDING-SYNC.md). It is the
      informal write-up of part of this development rather than a prior source
      for it, hence background. Supplies all three results in the compared
      set: the true-kernel positivity window with margin 0.005 and its
      persistence on the grid (0.4, 0.9).
  - title: "Screw functions and the Weil quadratic form"
    authors:
      - "Masatoshi Suzuki"
    id: "arXiv:2606.09096"
    type: paper
    location: "Theorem 4.2 (existence of a positivity window)"
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      Source of the zeta screw function and its Gram kernel, which are
      transcribed into Lean here as Psi and G. Suzuki's Theorem 4.2 establishes
      that some window of positive definiteness for the genuine kernel exists;
      this development exhibits and certifies an explicit such window on the
      grid (0.2, 0.4, 0.6) with an explicit margin. Background rather than
      formalizes: the compared statements are explicit finite instances with
      explicit margins, not Suzuki's existence theorem.
  - title: "Quadratic forms, real zeros and echoes of the spectral action"
    authors:
      - "Alain Connes"
      - "Walter D. van Suijlekom"
    id: "arXiv:2511.23257"
    type: paper
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      One of the two studies of truncated Weil quadratic forms that this
      development is positioned against. It works with floating-point
      numerics for the truncated form; no statement of theirs is formalized
      here, and none of the compared theorems is theirs.
  - title: "Zeta spectral triples"
    authors:
      - "Alain Connes"
      - "Caterina Consani"
      - "Henri Moscovici"
    id: "arXiv:2511.22755"
    type: paper
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The operator-theoretic reading of the truncated Weil form that motivates
      the structural skeleton of the wider development (finite
      Osterwalder-Schrader reconstruction, the finite KMS identity, the
      Caratheodory-Toeplitz ladder). Context only: none of its results is
      formalized, and none of the three compared theorems is one of theirs.
  - title: 'Sur les "formules explicites" de la theorie des nombres premiers'
    authors:
      - "Andre Weil"
    type: paper
    location: "Comm. Sem. Math. Univ. Lund (1952), 252-265"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: >-
      The explicit formula and the positivity criterion that give the whole
      programme its subject; the source's own results are not formalized
      here.
  - title: "mathlib4: the Lean mathematical library"
    authors:
      - "The Mathlib Community"
    id: "https://github.com/leanprover-community/mathlib4"
    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"
    note: >-
      The ambient library. Challenge.lean imports only Mathlib. Mathlib
      supplies the matrix, spectral, analytic and arithmetic-function
      infrastructure used throughout (Matrix.PosDef, Hermitian eigenvalues,
      the von Mangoldt function, digit lemmas for log 2), and its recently
      merged zeta and L-function stratum is the layer this work sits above.
      Recorded as a background source because the mathematics used from it is
      contextual infrastructure rather than the recorded result; it is a Lean
      dependency and not a mathematical source for any compared statement.

related_formalizations: []

status:
  scope: >-
    Formalized: exactly the three statements listed in comparator.json and
    stated in Challenge.lean, with sorry-free proofs in RequestProject/, all
    inside the wider 76-module development in that directory. These are
    positivity certificates about explicit finite matrices at explicit
    rationals. The wider development also contains other material, including
    the prime-side identity V5_7.weil_triangle_prime_side, the
    horizon-threshold results of the
    Certified Positivity preprint (RequestProject/G3.lean, G5.lean and related
    files) and the Tier R work written up in the companion preprint
    papers/certified-frontiers-paper.pdf; none of it is part of this
    submission or of the compared set.

    Sorry sites. The development is sorry-free. It formerly contained exactly
    three documented sorry sites, in RequestProject/D4.lean,
    RequestProject/F3.lean and RequestProject/F3R.lean, with one shared cause:
    unitary diagonalizability of a Hermitian matrix is not available in
    Mathlib in the form required. On 2026-09-14, in a second Aristotle
    (Harmonic) API job, all three were closed without changing their
    statements: F3R.F3R_simple (simplicity of the annihilator's roots) by a
    deeper use of the file's own Toeplitz shift identity, avoiding unitary
    diagonalization entirely; F3.F3_roots by transfer from the now-complete
    F3R.F3R_roots (F3.lean now imports F3R); and D4.D4_caratheodory, the full
    Carathéodory-Fejér theorem, via least-singular-block selection, F3R,
    window propagation of the null relation, and Vandermonde interpolation,
    with general-purpose lemmas factored into the new module
    RequestProject/D4Aux.lean. None of the three compared theorems depended on
    any of them, directly or transitively, either before or after this
    change. There are no sorries in any definition, and none anywhere in the
    development now. Challenge.lean's own three deliberate sorries are the
    comparator placeholders and are not counted here.

    native_decide. native_decide was formerly used in two files of the wider
    development, both in numeric bound lemmas: RequestProject/E2.lean (six
    uses, underlying E2_log3, E2_log5 and E2_log7) and RequestProject/G4.lean
    (one use, underlying G4_log11). Neither file is in the import closure of
    the three compared theorems. On 2026-09-14 those four bound lemmas were
    re-proved by the
    Aristotle prover using Mathlib's Real.abs_log_sub_add_sum_range_le
    Mercator-series tail bound together with Real.log_two_gt_d9 and
    Real.log_two_lt_d9, with all arithmetic discharged by norm_num/linarith;
    no statement changed. The whole development is now native_decide-free,
    verified by a full rebuild, #print axioms on the affected theorems, and
    comparator replay (Lean-kernel and NanoDa) against the then-current
    Challenge.lean and comparator.json. RequestProject/G1.lean, which is in
    the import closure of the compared theorems through V5_2.lean, was always
    native_decide-free and only mentions native_decide in its module
    docstring, describing what it avoids.

    Not claimed. No statement here is about the Riemann Hypothesis and none
    implies progress on it. Every positivity statement concerns one specified
    finite grid; there is no fine-grid, all-grid, infinite-grid or asymptotic
    positivity statement. The claim that the true kernel's positivity window is
    the first machine-checked instance of its kind is made only to our
    knowledge, on the basis of the literature search reported in the
    preprint. Proof terms were audited at statement level only; see the
    review block.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "V5_5.true_kernel_grid_margin"
