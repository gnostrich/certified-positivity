# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Palomar registry submission for this repository.
version: "v0.4"

project:
  name: "Certified Positivity and Certified Frontiers: machine-checked positivity windows for truncated Weil-type quadratic forms and the Suzuki screw kernel"
  description: >-
    This Lean 4 and Mathlib development produces exact, machine-checked
    positivity certificates for truncated Weil-type quadratic forms and for
    the finite Gram matrices of Suzuki's zeta screw function. Weil's explicit
    formula recasts the Riemann Hypothesis as positivity of a quadratic form
    assembled from prime powers, and a recent line of work truncates that form
    and studies the resulting finite matrices. The objects formalized here are
    the screw function Psi, built from an archimedean profile minus a von
    Mangoldt weighted prime sum; its Gram kernel G(t,u) = Psi(t) + Psi(u) -
    Psi(t-u); positive definiteness of the finite matrices this kernel
    generates on explicit grids; Schur-complement bordering of such a matrix
    by one new site; and quantitative Gershgorin diagonal-dominance margins
    that furnish explicit Rayleigh floors.

    The compared results are as follows. First, an explicit positivity window
    for the genuine screw kernel: on the grid (0.2, 0.4, 0.6) the three by
    three Gram matrix is positive definite with certified Rayleigh margin
    0.005, and positivity persists on (0.4, 0.9), across the entry of the
    first prime atom. Second, an exact prime-side identity: the triangle-kernel
    sum over prime powers equals the prime sum appearing in Psi. Third, a
    certified-frontier object: a state carrying a symmetric matrix with its own
    positive-definiteness proof and a certified margin, a one-site expansion
    gated by a single scalar Schur condition, an honest halt proving that the
    proposed bordered matrix is not positive definite whenever the gate fails,
    a characterisation of positive definiteness as vanishing
    nonpositive inertia, and a sound executable rational Sylvester checker.
    Fourth, a three-site full-band coverage theorem on the band [1/5, 3/5]
    with explicit mesh 1/5 and margin 1/200, together with the exact identity
    showing that the diagonal-dominance margin of its last row is zero. Fifth,
    two pre-registered hypotheses refuted by machine and reported as results:
    the archimedean profile is not convex on [0, 2/5], and no positive mesh
    and margin can cover every admissible grid. Sixth, two horizon-window
    results at the true prime atoms: non-positivity of the third window's
    4 by 4 Toeplitz-like form at kappa_1 = 0.789, and the global maximum of
    log p over sqrt p at p = 7 among all primes.

    The interest is that the surrounding literature (Connes and van Suijlekom;
    Connes, Consani and Moscovici; Suzuki) works either in floating point or at
    the level of existence statements, whereas these are exact certificates
    checked against the definition of Psi itself. Suzuki establishes that some
    positivity window exists; here an explicit one is exhibited and verified,
    to our knowledge for the first time.

    Scope is finite and explicit. Every positivity statement concerns
    specified rational grids; there is no asymptotic or fine-mesh result; the
    coverage theorem's mesh condition forces the unique coarse grid
    (1/5, 2/5, 3/5) rather than a continuum of three-site configurations; and
    nothing here bears on the Riemann Hypothesis.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

