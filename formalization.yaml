automation:
  methods:
    - method: autonomous
      models: ["Aristotle"]
      framework: "Aristotle (Harmonic)"
      tool_setup: >-
        Every .lean file under RequestProject/ is a per-batch deliverable of the
        automated theorem prover Aristotle, by Harmonic, apart from the
        mechanical module-system header and the proof repairs required by the
        move to Lean v4.35.0, both described under the copilot method.
        The workflow ran in
        batches: the human author wrote a specification for a batch of
        statements (definitions first, then the theorem statements to be
        proved, with the pinned toolchain fixed at Lean 4 v4.28.0 and Mathlib
        v4.28.0); the prover produced the Lean sources; and each batch came
        back with a compilation report that was retained as the primary
        provenance record. Statements that failed, or that the prover reported
        as false, were returned to the specification stage and re-posed. In
        one case the prover corrected a false numerical enclosure in the human
        specification; in another it discovered that the requested
        diagonal-dominance bound was exactly tight on the target grid and
        certified positivity by a different route rather than misattribute the
        method. No proof search or tactic scripting was done by hand. On
        2026-09-14, in a single follow-up API job, Aristotle also re-proved
        the four numeric bound lemmas that had originally used native_decide
        (E2_log3, E2_log5, E2_log7 in RequestProject/E2.lean and G4_log11 in
        RequestProject/G4.lean), replacing them with kernel-checkable proofs
        via Mathlib's Mercator-series tail bound, making the whole development
        native_decide-free. In a second API job the same day, Aristotle
        closed the three previously open sorry declarations without changing
        their statements: F3R.F3R_simple (RequestProject/F3R.lean), by a
        deeper use of the file's Toeplitz shift identity, avoiding unitary
        diagonalization, with new supporting lemmas in the same file;
        F3.F3_roots (RequestProject/F3.lean), obtained by transfer from the
        completed F3R.F3R_roots, with F3.lean now importing F3R; and
        D4.D4_caratheodory (RequestProject/D4.lean), the full
        Carathéodory-Fejér theorem, via least-singular-block selection, F3R,
        window propagation of the null relation, and Vandermonde
        interpolation, with general-purpose lemmas in the new module
        RequestProject/D4Aux.lean. The development is now sorry-free as well
        as native_decide-free, across all 76 modules, with every declaration
        depending only on propext, Classical.choice and Quot.sound; the
        compared theorems are unchanged.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Batches were posed as written mathematical specifications rather than
        conversational prompts: the exact Lean definitions to be used, the
        exact statements to be proved, the axiom budget (propext, Quot.sound,
        Classical.choice only, with native_decide to be avoided wherever
        possible and disclosed where not), and, for the experimental batches,
        pre-registered hypotheses stated in advance so that a refutation would
        count as a result rather than a failure. Certificate schemas
        were specified so that exact rational verification could compose with
        analytic error bounds.
    - method: copilot
      models: ["Claude (Anthropic)"]
      framework: "Claude"
      tool_setup: >-
        An AI assistant (Claude, Anthropic) was used by the author for
        specification development, that is drafting and refining the Lean
        definitions and statements handed to the prover, and for the
        statement-level audit of prover output against those specifications,
        including the construction and checking of Challenge.lean as the
        Mathlib-only restatement of the three compared theorems. The prose of
        the two preprints and of this metadata record was likewise produced
        with that assistance, as was the mechanical port of every .lean file
        to Lean's module system (a module header, public imports and an
        exposed public section, with no statement or proof changed). In
        November 2026 the development was moved from Lean and Mathlib v4.28.0
        to v4.35.0, because Palomar now requires Lean v4.35.0-rc2 or later.
        Proof scripts in 29 files of RequestProject/ no longer elaborated (A1,
        A3, A5, B2, B4, C1, C3Gibbs, C3Objective, C3Pos, D4Aux, D6, E5, F1,
        F2, F3R, G5, H3a, H3b, I2, J1, K1, K3, R5Final, R5Prime, R_A5, R_A6,
        V5_2, V5_4, V5_7); two
        of them (V5_2, V5_4) are in the import closure of the
        compared theorems. Claude agents repaired them, editing proof scripts
        only: no statement, definition or name changed, no sorry or new axiom
        was introduced, and no heartbeat limit was raised. Most repairs close a
        side goal true by definition that the old convert or simp had closed
        implicitly, or adapt to a changed Mathlib lemma signature. Apart from
        these repairs it produced no proof terms.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Used interactively on specification text and on statement-by-statement
        comparison of delivered Lean statements against the intended ones. The
        audit protocol was to read each delivered statement against its
        specification and record any deviation explicitly; the deviations found
        are recorded in fidelity.divergences and marked at the theorems in
        Challenge.lean.
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author set the problems, chose the mathematical objects and
        the discretization families, designed the certificate schemas and the
        tier architecture, pre-registered the structural hypotheses before the
        batches that decided them, made every mathematical and editorial
        decision, selected the three theorems for the compared set, and
        performed the final review of statements, axiom disclosures and scope.
        The consolidated lake build was re-run independently of the prover's
        environment. The author takes responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The division of labour is: human problem-setting, specification design,
    pre-registration and decisions; AI-assisted specification drafting and
    statement-level audit; automated proof production by Aristotle
    (Harmonic). No human has reviewed the proof terms line by line. The trust
    model is Lean's kernel plus the axiom audit: the consolidated all-files
    lake build was re-run outside the prover's environment on 2026-07-26 on the
    pinned toolchain (Lean 4 v4.28.0, Mathlib v4.28.0), building all 75
    modules then present with zero errors, exactly the three disclosed sorry
    warnings, and #print axioms output on the headline theorems matching the
    disclosures here. On 2026-09-14 those three sorry warnings were closed
    (see automation.methods.autonomous and status.scope above); the
    consolidated build, now covering 76 modules, emits none, and this is
    re-run in CI. On 2026-11-13 the development was moved to Lean v4.35.0
    and Mathlib v4.35.0 (see automation.methods.copilot for the proof repairs
    this required); the consolidated build of all 76 modules was re-run on
    that toolchain with zero errors and no sorry warnings, and the compared
    set was re-checked in this repository's CI with the toolchain's lake
    comparator. The per-batch
    compilation reports remain the original provenance record.

fidelity:
  divergences: >-
    There is no cited source whose statements this development reproduces, so
    the fidelity question here is between the sorry-free repository modules and
    their restatement in Challenge.lean, which is what Palomar compares.

    One systematic transformation: Challenge.lean imports only Mathlib and
    therefore contains inlined copies of every custom definition the three
    statements need, copied from the named repository files. Because those
    copies all live in the single namespace Challenge, the namespace prefixes
    of the originals (Horizon., V5_1., V5_5., V5_6.) are necessarily
    dropped. This applies to every inlined definition and statement. There
    are no individual statement deviations.

    Challenge.lean makes no axiom claim of its own: every proof in it is sorry,
    so #print axioms on that file is meaningless by design. Axiom status is a
    property of the repository modules.

review:
  status: >-
    self-assessed; automated mechanical checks in this repository's CI
    (consolidated lake build with sorry census; lake comparator from the
    pinned Lean v4.35.0 toolchain, statement match with replay through Lean's
    kernel and the NanoDa and con-ron binaries shipped in that toolchain,
    against Challenge.lean for all 3 compared theorems); statement-level audit
    of prover output was AI-assisted; no line-by-line human review of proof
    terms; no external mathematical peer review yet
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    What was checked mechanically: the consolidated all-files lake build on the
    pinned toolchain, re-run independently of the prover's environment and
    re-run in CI, with no sorry warnings and no errors (as of the 2026-09-14
    closure of the three previously disclosed sorry sites; see status.scope
    above); #print axioms on the headline theorems; and, in this repository's
    CI (.github/workflows/build.yml), the lake comparator shipped with the
    pinned Lean v4.35.0 toolchain, run against Challenge.lean for the three
    theorems in comparator.json, covering statement match, byte-identical
    definition graphs, the axiom allowlist (propext, Quot.sound,
    Classical.choice only) and replay through Lean's kernel and the
    nanoda_bin and con-ron binaries found in that toolchain's bin directory.

    These repository checks are distinct from Palomar's own mechanical
    verification of the submission, which Palomar runs separately with
    checkers it pins itself (its report records, for example, con-ron from a
    separately pinned Lean release rather than from this repository's
    toolchain). Palomar's report, not this file, is the record of what
    Palomar checked.

    What was checked by a human: the choice and wording of every statement, the
    scope and non-claim lists, the axiom and sorry disclosures, and the
    contents of this file. STATEMENTS.md carries
    the verbatim formal statements so that the claims can be read without
    trusting any prose.

    What was not done: no human has read the proof terms line by line,
    including the AI-made repairs for the Lean v4.35.0 move; the
    statement-level audit of prover output against the specifications was
    AI-assisted rather than independently human-verified; and neither preprint
    has been submitted or peer-reviewed. Scrutiny is invited through the
    repository's issues and pull requests.

