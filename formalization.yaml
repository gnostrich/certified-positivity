automation:
  methods:
    - method: autonomous
      models: ["Aristotle"]
      framework: "Aristotle (Harmonic)"
      tool_setup: >-
        Every .lean file under RequestProject/ is a per-batch deliverable of the
        automated theorem prover Aristotle, by Harmonic. The workflow ran in
        batches: the human author wrote a specification for a batch of
        statements (definitions first, then the theorem statements to be
        proved, with the pinned toolchain fixed at Lean 4 v4.28.0 and Mathlib
        v4.28.0); the prover produced the Lean sources; and each batch came
        back with a compilation report that was retained as the primary
        provenance record. Statements that failed, or that the prover reported
        as false, were returned to the specification stage and re-posed. In
        one case the prover corrected a false numerical enclosure in the human
        specification; in another it discovered that the requested
        diagonal-dominance bound was exactly tight on the target grid and
        certified positivity by a different route rather than misattribute the
        method. No proof search or tactic scripting was done by hand. On
        2026-09-14, in a single follow-up API job, Aristotle also re-proved
        the four numeric bound lemmas that had originally used native_decide
        (E2_log3, E2_log5, E2_log7 in RequestProject/E2.lean and G4_log11 in
        RequestProject/G4.lean), replacing them with kernel-checkable proofs
        via Mathlib's Mercator-series tail bound, making the whole development
        native_decide-free. In a second API job the same day, Aristotle
        closed the three previously open sorry declarations without changing
        their statements: F3R.F3R_simple (RequestProject/F3R.lean), by a
        deeper use of the file's Toeplitz shift identity, avoiding unitary
        diagonalization, with new supporting lemmas in the same file;
        F3.F3_roots (RequestProject/F3.lean), obtained by transfer from the
        completed F3R.F3R_roots, with F3.lean now importing F3R; and
        D4.D4_caratheodory (RequestProject/D4.lean), the full
        Carathéodory-Fejér theorem, via least-singular-block selection, F3R,
        window propagation of the null relation, and Vandermonde
        interpolation, with general-purpose lemmas in the new module
        RequestProject/D4Aux.lean. The development is now sorry-free as well
        as native_decide-free, across all 76 modules, with every declaration
        depending only on propext, Classical.choice and Quot.sound; the
        eighteen compared theorems are unchanged.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Batches were posed as written mathematical specifications rather than
        conversational prompts: the exact Lean definitions to be used, the
        exact statements to be proved, the axiom budget (propext, Quot.sound,
        Classical.choice only, with native_decide to be avoided wherever
        possible and disclosed where not), and, for the experimental batches,
        pre-registered hypotheses stated in advance so that a refutation would
        count as a result rather than a failure. Two such hypotheses were
        refuted by the prover and are reported as results. Certificate schemas
        were specified so that exact rational verification could compose with
        analytic error bounds.
    - method: copilot
      models: ["Claude (Anthropic)"]
      framework: "Claude"
      tool_setup: >-
        An AI assistant (Claude, Anthropic) was used by the author for
        specification development, that is drafting and refining the Lean
        definitions and statements handed to the prover, and for the
        statement-level audit of prover output against those specifications,
        including the construction and checking of Challenge.lean as the
        Mathlib-only restatement of the eighteen compared theorems. The prose of
        the two preprints and of this metadata record was likewise produced
        with that assistance. It produced no proof terms.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Used interactively on specification text and on statement-by-statement
        comparison of delivered Lean statements against the intended ones. The
        audit protocol was to read each delivered statement against its
        specification and record any deviation explicitly; the deviations found
        are recorded in fidelity.divergences and marked at the theorems in
        Challenge.lean.
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author set the problems, chose the mathematical objects and
        the discretization families, designed the certificate schemas and the
        tier architecture, pre-registered the structural hypotheses before the
        batches that decided them, made every mathematical and editorial
        decision, selected the eighteen theorems for the compared set, and
        performed the final review of statements, axiom disclosures and scope.
        The consolidated lake build was re-run independently of the prover's
        environment. The author takes responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The division of labour is: human problem-setting, specification design,
    pre-registration and decisions; AI-assisted specification drafting and
    statement-level audit; automated proof production by Aristotle
    (Harmonic). No human has reviewed the proof terms line by line. The trust
    model is Lean's kernel plus the axiom audit: the consolidated all-files
    lake build was re-run outside the prover's environment on 2026-07-26 on the
    pinned toolchain (Lean 4 v4.28.0, Mathlib v4.28.0), building all 75
    modules then present with zero errors, exactly the three disclosed sorry
    warnings, and #print axioms output on the headline theorems matching the
    disclosures here. On 2026-09-14 those three sorry warnings were closed
    (see automation.methods.autonomous and status.scope above); the
    consolidated build, now covering 76 modules, emits none, and this is
    re-run in CI. The per-batch compilation reports remain the original
    provenance record.

fidelity:
  divergences: >-
    There is no cited source whose statements this development reproduces, so
    the fidelity question here is between the sorry-free repository modules and
    their restatement in Challenge.lean, which is what Palomar compares.

    One systematic transformation: Challenge.lean imports only Mathlib and
    therefore contains inlined copies of every custom definition the eighteen
    statements need, copied from the named repository files. Because those
    copies all live in the single namespace Challenge, the namespace prefixes
    of the originals (Horizon., V5_1., V5_5., V5_6., TierR., R5. and so on) are
    necessarily dropped. This applies to every inlined definition and
    statement.

    Two individual statement deviations, both marked at the theorem in
    Challenge.lean. (1) expand_pd: the repository states
    IsPDq (G.expand b d hs).M, where expand is a GramState-valued constructor
    whose hsymm and hpd fields carry proofs and so cannot be inlined without
    them; Challenge.lean states IsPDq (border G.M b d) instead. Since
    (G.expand b d hs).M is definitionally border G.M b d, this is the same
    claim with the constructor unfolded. (2) frontier_covers_band_final:
    notation only. The repository writes the kernel as V5_1.G, but in
    Challenge.lean the existential binder G : GramState shadows the
    unqualified kernel name, so the kernel is written Challenge.G. Same
    constant, same statement.

    Challenge.lean makes no axiom claim of its own: every proof in it is sorry,
    so #print axioms on that file is meaningless by design. Axiom status is a
    property of the repository modules.

review:
  status: >-
    self-assessed; automated mechanical checks (consolidated lake build in CI
    with sorry census; leanprover/comparator statement match and both
    Lean-kernel and NanoDa replay against Challenge.lean for all 18 compared
    theorems); statement-level audit
    of prover output was AI-assisted; no line-by-line human review of proof
    terms; no external mathematical peer review yet
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    What was checked mechanically: the consolidated all-files lake build on the
    pinned toolchain, re-run independently of the prover's environment and
    re-run in CI, with no sorry warnings and no errors (as of the 2026-09-14
    closure of the three previously disclosed sorry sites; see status.scope
    above); #print axioms on the headline theorems; and leanprover/comparator
    (pinned) against Challenge.lean for the eighteen theorems in
    comparator.json, covering statement match, byte-identical definition
    graphs, the axiom allowlist (propext, Quot.sound, Classical.choice only)
    and both Lean-kernel and NanoDa replay.

    What was checked by a human: the choice and wording of every statement, the
    scope and non-claim lists in STATEMENTS.md and TIER_R_FINAL.md, the axiom
    and sorry disclosures, and the contents of this file. STATEMENTS.md carries
    the verbatim formal statements so that the claims can be read without
    trusting any prose.

    What was not done: no human has read the proof terms line by line; the
    statement-level audit of prover output against the specifications was
    AI-assisted rather than independently human-verified; and neither preprint
    has been submitted or peer-reviewed. Scrutiny is invited through the
    repository's issues and pull requests.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Certified Positivity, headline theorem V5_5 (true-kernel window)"
      lean: "Challenge.true_kernel_grid_margin"
      module: "Challenge"
      status: proved
      note: >-
        The explicit Rayleigh floor of the paper's true-kernel window: 0.005
        times the squared norm bounds the quadratic form of the genuine screw
        Gram matrix on the grid (0.2, 0.4, 0.6); proved sorry-free as
        V5_5.true_kernel_grid_margin in RequestProject/V5_5.lean.
    - source: "Certified Positivity, headline theorem V5_5 (true-kernel window)"
      lean: "Challenge.true_kernel_grid_posdef"
      module: "Challenge"
      status: proved
      note: >-
        The positive-definiteness half of the same window, the paper's claimed
        first explicit machine-checked instance of Suzuki's existential
        Theorem 4.2; proved sorry-free as V5_5.true_kernel_grid_posdef in
        RequestProject/V5_5.lean.
    - source: "Certified Positivity, headline theorem V5_6 (persistence across the first prime)"
      lean: "Challenge.true_kernel_first_prime_posdef"
      module: "Challenge"
      status: proved
      note: >-
        The two-site true-kernel Gram matrix on (0.4, 0.9) remains positive
        definite across the entry of the first prime atom; proved sorry-free as
        V5_6.true_kernel_first_prime_posdef in RequestProject/V5_6.lean.
    - source: "Certified Positivity, headline theorem V5_7 (prime-side identity)"
      lean: "Challenge.weil_triangle_prime_side"
      module: "Challenge"
      status: proved
      note: >-
        The exact identity welding the paper's two formal objects: the von
        Mangoldt weighted triangle-kernel sum over prime powers up to N equals
        the prime sum of the screw function, for exp t at most N; proved
        sorry-free as V5_7.weil_triangle_prime_side in
        RequestProject/V5_7.lean.
    - source: "Certified Frontiers, headline theorem R_A1 (Schur criterion)"
      lean: "Challenge.schur_pos_isPDq"
      module: "Challenge"
      status: proved
      note: >-
        A positive scalar Schur complement extends a positive-definite matrix
        to its symmetric one-site border, which is the soundness of the
        frontier's expansion gate; proved sorry-free as TierR.schur_pos_isPDq
        in RequestProject/R_A1.lean.
    - source: "Certified Frontiers, headline theorem R_A3_A4 (gated expansion)"
      lean: "Challenge.expand_pd"
      module: "Challenge"
      status: proved
      note: >-
        Faithfulness of the gated one-site expansion of a GramState; proved
        sorry-free as TierR.GramState.expand_pd in
        RequestProject/R_A3_A4.lean. The Challenge statement unfolds the
        GramState constructor to the definitionally equal bordered matrix, as
        recorded in fidelity.divergences.
    - source: "Certified Frontiers, headline theorem R_A3_A4 (honest halt)"
      lean: "Challenge.halt_not_pd"
      module: "Challenge"
      status: proved
      note: >-
        Honest halting: when the scalar gate fails, the proposed border is
        provably not positive definite, so a halt is a certified
        counterexample and not an inconclusive result; proved sorry-free as
        TierR.GramState.halt_not_pd in RequestProject/R_A3_A4.lean.
    - source: "Certified Frontiers, headline theorem R_A5 (inertia meter)"
      lean: "Challenge.isPDq_iff_nMinus_nZero_eq_zero"
      module: "Challenge"
      status: proved
      note: >-
        Positive definiteness of a symmetric matrix is exactly the vanishing
        of the negative and zero eigenvalue counts at threshold zero, the
        paper's certifier-equals-instrument reading; proved sorry-free as
        TierR.isPDq_iff_nMinus_nZero_eq_zero in RequestProject/R_A5.lean.
    - source: "Certified Frontiers, headline theorem R_B1 (executable checker)"
      lean: "Challenge.checkPDq_sound"
      module: "Challenge"
      status: proved
      note: >-
        Soundness of the Boolean rational Sylvester checker: if the checker
        returns true then the real cast of the rational matrix is positive
        definite, decidable over the rationals without native_decide; proved
        sorry-free as TierR.checkPDq_sound in RequestProject/R_B1.lean.
    - source: "Certified Frontiers, headline theorem R5 (refutation, ground 1)"
      lean: "Challenge.PsiArch_not_convex"
      module: "Challenge"
      status: proved
      note: >-
        Machine refutation of the first pre-registered hypothesis: the
        archimedean profile of the screw function is not convex on [0, 2/5],
        so the originally proposed convexity route to coverage is unavailable;
        proved sorry-free as R5.PsiArch_not_convex in RequestProject/R5.lean.
    - source: "Certified Frontiers, headline theorem R5 (refutation, ground 2)"
      lean: "Challenge.coverage_prime_free"
      module: "Challenge"
      status: proved
      note: >-
        Machine refutation of the pre-registered all-grid coverage statement as
        posed: no positive mesh and margin exist, because the admissible
        singleton grid at the origin has zero diagonal; proved sorry-free as
        R5.coverage_prime_free in RequestProject/R5.lean.
    - source: "Certified Frontiers, headline theorem R5Prime (Rayleigh floor from diagonal dominance)"
      lean: "Challenge.gershgorin_margin"
      module: "Challenge"
      status: proved
      note: >-
        The general quantitative diagonal-dominance Rayleigh floor for finite
        real symmetric matrices, with no sign assumption on the margin,
        strengthening the dominance direction of Gershgorin's theorem; proved
        sorry-free as R5.gershgorin_margin in RequestProject/R5Prime.lean.
    - source: "Certified Frontiers, headline theorem R5Prime (two-site coverage)"
      lean: "Challenge.coverage_band"
      module: "Challenge"
      status: proved
      note: >-
        Two-site coverage of the band [1/5, 3/5] at an explicit mesh and
        margin, obtained by instantiating the Rayleigh-floor lemma at
        separation 2/5 and margin 3/100; proved sorry-free as
        R5.coverage_band in RequestProject/R5Prime.lean.
    - source: "Certified Frontiers, headline theorem R5Final (tightness discovery); Tier R ledger, TIER_R_FINAL.md"
      lean: "Challenge.three_grid_last_row_gershgorin_zero"
      module: "Challenge"
      status: proved
      note: >-
        The exact identity showing that on the grid (1/5, 2/5, 3/5) the last
        row's diagonal equals the sum of its two off-diagonal entries, so its
        diagonal-dominance margin is exactly zero and the Gershgorin engine
        cannot supply a positive three-site floor; proved sorry-free as
        R5.three_grid_last_row_gershgorin_zero in
        RequestProject/R5Final.lean.
    - source: "Certified Frontiers, headline theorem R5Final (coverage theorem); Tier R ledger, TIER_R_FINAL.md"
      lean: "Challenge.coverage_band_final"
      module: "Challenge"
      status: proved
      note: >-
        The closing coverage rung: three strictly increasing sites in
        [1/5, 3/5] at total-pairwise mesh 1/5 give a positive-definite genuine
        screw Gram matrix with Rayleigh floor 1/200; proved sorry-free as
        R5.coverage_band_final (stated identically as R5.coverage_band_k) in
        RequestProject/R5Final.lean, using the audited V5_5 margin rather than
        a Gershgorin floor. The ledger records that the mesh condition forces
        the unique grid (1/5, 2/5, 3/5).
    - source: "Certified Frontiers, headline theorem R5Final (frontier form); Tier R ledger, TIER_R_FINAL.md"
      lean: "Challenge.frontier_covers_band_final"
      module: "Challenge"
      status: proved
      note: >-
        The frontier form of the coverage theorem: under the same explicit
        mesh a three-dimensional certified GramState represents the true
        kernel matrix, built literally by one singleton and two successful
        expansions with both Schur gates discharged; proved sorry-free as
        R5.frontier_covers_band_final in RequestProject/R5Final.lean. The
        Challenge statement differs in kernel notation only, as recorded in
        fidelity.divergences.
    - source: "Certified Positivity, G3 (third-window non-positivity certificate)"
      lean: "Challenge.G3_cert_neg"
      module: "Challenge"
      status: proved
      note: >-
        Positivity genuinely fails at the third window's negative threshold
        kappa_1 = 0.789 for the true prime atoms (log 2)/sqrt 2, (log 3)/sqrt 3,
        (log 5)/sqrt 5 against the third-window 4 by 4 symmetric Toeplitz-like
        form U; proved sorry-free as G3.G3_cert_neg in RequestProject/G3.lean.
        Its numeric-bound dependencies in RequestProject/E2.lean and
        RequestProject/G4.lean were re-proved native_decide-free on
        2026-09-14 (see status.scope), so this theorem now sits on the
        3-axiom baseline and has been restored to the compared set.
    - source: "Certified Positivity, G5 (global maximum of log p/√p at p = 7, prime form)"
      lean: "Challenge.G5_c_prime"
      module: "Challenge"
      status: proved
      note: >-
        For every prime p other than 7, (log p)/sqrt p is strictly less than
        (log 7)/sqrt 7: the atom at p = 7 is the global maximum over all
        primes; proved sorry-free as G5.G5_c_prime in RequestProject/G5.lean.
        Depends on RequestProject/G4.lean's log 11 enclosure, re-proved
        native_decide-free on 2026-09-14 (see status.scope), so this theorem
        now sits on the 3-axiom baseline and has been restored to the
        compared set.

